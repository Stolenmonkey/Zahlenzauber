<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlenzauber</title>
<style>
:root{--navy:#0b2a6b;--blue:#1f6fd1;--bar:#3d84d6;--green:#2f9e44;--ok:#2fbf71;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;height:100dvh;background:#8cc7f0;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--navy)}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#bfe6fb,#e6f5ff 70%);overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bar);border-bottom:3px solid #2f6fb9;color:#fff;font-size:22px;font-weight:800;min-height:68px}
.top.clear{background:none;border:0}.top b{flex:1;text-align:center}
.bk{border:0;background:none;color:#fff;font-size:32px;width:44px;cursor:pointer}.top.clear .bk{visibility:hidden}
.rt{min-width:44px;display:flex;justify-content:flex-end}#hb{display:none;gap:8px}.cnt{font-size:20px;white-space:nowrap}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #0003}
.scroll{flex:1;overflow-y:auto;padding:14px 16px 30px}
.view{display:none;animation:pop .3s}.view.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 #b9dcf5;margin-bottom:16px}
.hero{text-align:center;padding:6px 4px 0}.hero h1{font-size:46px;margin:0;letter-spacing:-1px}.hero .st{font-size:46px}
.hero p{font-size:19px;font-weight:700;margin:8px 0 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick{border:0;border-radius:26px;padding:16px 6px;color:#fff;font:inherit;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #0003}
.pick small{display:block;font-size:13px;font-weight:700;margin-top:2px}.pick:active,.btn:active,.hold:active{transform:translateY(4px);box-shadow:none}
.b1{background:linear-gradient(#3b8fe8,#1f6fd1)}.b2{background:linear-gradient(#4cc15f,#2f9e44)}
.ico{display:block;white-space:nowrap;font-size:clamp(34px,10vw,54px);line-height:1.2}
.grass{position:relative;height:150px;margin:12px -20px 0;background:radial-gradient(120% 140% at 25% 135%,#7fcf6a 0 55%,transparent 56%),radial-gradient(90% 120% at 95% 140%,#5fbf5a 0 55%,transparent 56%)}
.grass svg{position:absolute;right:26px;bottom:18px;width:112px;height:112px}.grass i{position:absolute;left:26px;bottom:26px;font-size:42px;font-style:normal}
.q{font-size:clamp(56px,19vw,104px);font-weight:900;text-align:center;padding:26px 0;background:#fff;border-radius:26px;box-shadow:0 6px 0 #b9dcf5}.q span{color:var(--blue)}
.msg{min-height:40px;text-align:center;font-size:24px;font-weight:900;margin:14px 0 8px}
.hold{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:99px;padding:20px;font:inherit;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#4cc15f,#2f9e44);box-shadow:0 6px 0 #23772f;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.hold.on{background:linear-gradient(#ffa24d,#ff6b2c);box-shadow:0 6px 0 #c24d17;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #c24d17,0 0 0 16px #ff8f3d44}}
.cap{margin-top:14px;background:#ffffffb0;border-radius:18px;padding:12px;text-align:center;font-size:17px;font-weight:700;color:#1b4b8f;min-height:50px}
.link{display:block;margin:12px auto 0;border:0;background:none;font:inherit;font-weight:800;color:var(--blue);cursor:pointer;font-size:18px}
.done{background:#fff4d6;border:3px solid #f6c453;border-radius:26px;padding:22px;text-align:center}
.done .st{font-size:84px}.done h2{margin:0 0 6px;font-size:32px}.done p{font-size:19px;font-weight:700}.stars{font-size:44px;letter-spacing:6px}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:16px;margin-top:12px;font:inherit;font-size:21px;font-weight:900;color:#fff;background:linear-gradient(#3b8fe8,#1f6fd1);box-shadow:0 5px 0 #14509c;cursor:pointer}
.btn.out{background:#fff;color:var(--blue);border:3px solid var(--blue);box-shadow:none}.btn.red{background:#ff6b6b;box-shadow:0 5px 0 #c24444}
.pill{display:inline-block;background:#7a63d8;color:#fff;border-radius:99px;padding:4px 16px;font-weight:800;margin-bottom:12px}
.lil{background:#efeafd;border:3px solid #cfc3f5;border-radius:24px;padding:16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:16px}
.stat div{border-radius:16px;padding:10px 2px}.stat div:nth-child(1){background:#fde9a8}.stat div:nth-child(2){background:#bfeabd}.stat div:nth-child(3){background:#bfe1f8}
.stat b{display:block;font-size:30px}.stat span{font-size:14px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:6px}
.pbar{height:18px;border-radius:99px;background:#ffd5d5;overflow:hidden;margin-bottom:14px}.pbar i{display:block;height:100%;background:var(--ok)}
label.f{display:block;font-weight:800;margin:16px 0 8px}
input[type=text]{width:100%;padding:12px 14px;font:inherit;font-size:20px;border:3px solid #cfe3f6;border-radius:14px;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{--c:#f7a6a6;min-width:60px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-size:22px;font-weight:900;color:var(--navy);background:var(--c);opacity:.45;cursor:pointer}
.chip.on{opacity:1;box-shadow:0 4px 0 #0003}.chip:nth-child(2){--c:#f9d56e}.chip:nth-child(3){--c:#9ddc9a}.chip:nth-child(4){--c:#8fd0f3}
.rev{position:absolute;right:14px;bottom:8px;font-size:12px;font-weight:700;color:var(--navy);opacity:.55}
.vp{display:none;height:14px;border-radius:99px;background:#d9e8f7;overflow:hidden;margin-top:8px}.vp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc15f,#2f9e44);transition:width .2s}.vp.ind i{width:35%;animation:ind 1.2s infinite ease-in-out}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.confetti{position:fixed;top:-20px;font-size:28px;pointer-events:none;z-index:9;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="fox" viewBox="0 0 100 100">
  <path d="M14 20 L34 38 L18 52Z" fill="#ff8f3d"/><path d="M86 20 L66 38 L82 52Z" fill="#ff8f3d"/>
  <path d="M19 27 L30 38 L21 46Z" fill="#ffd2a8"/><path d="M81 27 L70 38 L79 46Z" fill="#ffd2a8"/>
  <ellipse cx="50" cy="58" rx="36" ry="31" fill="#ff8f3d"/>
  <path d="M14 62 Q50 100 86 62 Q70 82 50 82 Q30 82 14 62Z" fill="#fff"/>
  <ellipse cx="36" cy="54" rx="6" ry="7.5" fill="#2d2250"/><ellipse cx="64" cy="54" rx="6" ry="7.5" fill="#2d2250"/>
  <circle cx="38" cy="51" r="2.2" fill="#fff"/><circle cx="66" cy="51" r="2.2" fill="#fff"/>
  <ellipse cx="50" cy="66" rx="5" ry="3.8" fill="#2d2250"/>
  <path d="M43 72 Q50 79 57 72" stroke="#2d2250" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <circle cx="27" cy="68" r="5" fill="#ff6b6b" opacity=".35"/><circle cx="73" cy="68" r="5" fill="#ff6b6b" opacity=".35"/>
  <path d="M24 30 L50 -2 L76 30 Q50 22 24 30Z" fill="#5b3fd1"/><path d="M20 31 Q50 20 80 31 Q50 38 20 31Z" fill="#7d5cf0"/>
  <path d="M50 8 l2.5 6 6 .5-4.6 4 1.5 6-5.4-3.4-5.4 3.4 1.5-6-4.6-4 6-.5Z" fill="#ffc83d" transform="translate(0 3) scale(.9) translate(5.5 0)"/>
</symbol></defs></svg>
<div id="app">
<div class="top clear" id="top">
  <button class="bk" onclick="go('home')" aria-label="Zurück">←</button><b id="bt"></b>
  <span class="rt"><span id="hb"><button class="ib" onclick="go('stats')" aria-label="Statistik">📊</button><button class="ib" onclick="go('settings')" aria-label="Einstellungen">⚙️</button></span><span class="cnt" id="cnt"></span></span>
</div>
<div class="scroll" id="sc">
<section class="view on" id="home">
  <div class="hero"><div class="st">⭐</div><h1>Zahlenzauber</h1><p id="greet"></p>
    <div class="two">
      <button class="pick b1" onclick="start('eyes')"><span class="ico">👀</span>Sehen<small>Aufgabe wird gezeigt</small></button>
      <button class="pick b2" onclick="start('ears')"><span class="ico">👂👂</span>Hören<small>Aufgabe wird vorgelesen</small></button>
    </div>
    <div class="grass"><i>📚</i><svg viewBox="0 0 100 100"><use href="#fox"/></svg></div>
  </div>
  <div class="rev">Rev. 14</div>
</section>
<section class="view" id="ex">
  <div class="q" id="q"></div>
  <div class="msg" id="msg"></div>
  <button class="hold" id="mic" onpointerdown="startHold(event)" onpointerup="endHold()" oncontextmenu="return false"><span>🎤</span><span id="mt">Halten &amp; sprechen</span></button>
  <button class="link" id="rep" style="display:none" onclick="replay()">🔊 Nochmal hören</button>
  <div class="cap" id="heard"></div>
  <div class="vp"><i></i></div>
  <button class="link" id="tab" style="display:none" onclick="window.open(location.href,'_blank')">↗ In neuem Tab öffnen</button>
</section>
<section class="view" id="done"><div class="done">
  <div class="st">⭐</div><h2>Runde geschafft!</h2><div class="stars" id="ds"></div><p id="dp"></p>
  <button class="btn" id="again">↻ Runde neu starten</button><button class="btn out" onclick="go('home')">🏠 Zurück zum Start</button>
</div></section>
<section class="view" id="stats"><div class="lil"><span class="pill">So läuft's</span>
  <div class="stat"><div><b id="sS">0</b><span>Sterne</span></div><div><b id="sR">0</b><span>Runden</span></div><div><b id="sB">0</b><span>beste Serie</span></div></div>
  <div id="sList"></div><button class="btn red" onclick="resetStats()">Statistik löschen</button></div></section>
<section class="view" id="settings"><div class="card">
  <label class="f" style="margin-top:0">Wie heißt du?</label><input type="text" id="sName" maxlength="20" placeholder="Name">
  <label class="f">Zahlenraum bis …</label><div class="chips" id="sAdd"></div>
  <label class="f">Aufgaben pro Runde</label><div class="chips" id="sLen"></div>
  <label class="f">Töne bei richtig/falsch</label><div class="chips" id="sSnd"></div>
  <label class="f">Spracherkennung</label><div class="chips" id="sEng"></div><div class="cap" id="vst" style="margin-top:10px"></div><div class="vp"><i></i></div>
</div></section>
</div></div>
<script>
const $=id=>document.getElementById(id);
const DEF={name:'',addMax:10,len:10,sound:true,engine:'chrome'};
const ZERO=()=>({rounds:0,stars:0,best:0,eyes:{r:0,w:0},ears:{r:0,w:0}});
let S={...DEF},ST=ZERO();
try{S={...DEF,...JSON.parse(localStorage.getItem('zz_set')||'{}')};ST={...ST,...JSON.parse(localStorage.getItem('zz_st')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('zz_set',JSON.stringify(S));localStorage.setItem('zz_st',JSON.stringify(ST))}catch(e){}};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let ac;function beep(f,d=.15){if(!S.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* Zahlen aus gesprochenem Text */
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const ON={null:0,eins:1,ein:1,eine:1,zwei:2,zwo:2,drei:3,vier:4,fuenf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwoelf:12,dreizehn:13,vierzehn:14,fuenfzehn:15,sechzehn:16,siebzehn:17,achtzehn:18,neunzehn:19,hundert:100,einhundert:100};
const TE={zwanzig:20,dreissig:30,vierzig:40,fuenfzig:50,sechzig:60,siebzig:70,achtzig:80,neunzig:90};
function wnum(w){if(has(ON,w))return ON[w];if(has(TE,w))return TE[w];const k=w.indexOf('und');
  if(k>0&&has(ON,w.slice(0,k))&&has(TE,w.slice(k+3))&&ON[w.slice(0,k)]>0)return ON[w.slice(0,k)]+TE[w.slice(k+3)];return null}
const AL={sex:6,seks:6,zechs:6,six:6,sechse:6,swei:2,zwoe:2,two:2,dry:3,three:3,drai:3,fier:4,fuer:4,four:4,finf:5,five:5,seven:7,eight:8,echt:8,nine:9,neu:9,noin:9,zen:10,sehen:10,zeh:10,zehen:10,ten:10,one:1,eis:1,eines:1};
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function fuzzy(w){if(w.length<4)return null;const hit=new Set();
  for(const o of [ON,TE])for(const k in o)if(k!=='ein'&&k!=='eine'&&Math.abs(k.length-w.length)<=1&&lev(w,k)<=1)hit.add(o[k]);
  return hit.size===1?[...hit][0]:null}
function nums(t){t=t.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+und\s+/g,'und');
  const r=(t.match(/\d+/g)||[]).map(Number);t.split(/[^a-z]+/).forEach(w=>{if(!w)return;let n=wnum(w);if(n===null)n=has(AL,w)?AL[w]:fuzzy(w);if(n!==null)r.push(n)});return r}


const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(t,cb){const sy=window.speechSynthesis;if(!sy||!window.SpeechSynthesisUtterance){cb&&cb();return}
  sy.cancel();const u=new SpeechSynthesisUtterance(t),vs=sy.getVoices();u.lang='de-DE';u.rate=.9;u.pitch=1.15;
  const v=vs.find(x=>x.lang.replace('_','-')==='de-DE')||vs.find(x=>x.lang.startsWith('de'));if(v)u.voice=v;
  let d=false;const f=()=>{if(!d){d=true;cb&&cb()}};u.onend=f;u.onerror=f;setTimeout(f,7000);sy.speak(u)}

let tok=0,rec=null,adv=null,lock=false,holding=false,heardAll=[],mode,i,ok,streak,cur,micOK=null;
const FRAMED=window.self!==window.top,TITLES={stats:'Meine Statistik',settings:'Einstellungen',done:'Geschafft!'};
async function askMic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());return true}catch(e){return false}}
function warn(){$('heard').textContent=!window.isSecureContext?'Chrome erlaubt das Mikrofon nur auf https-Webseiten, nicht bei lokal geöffneten Dateien.':FRAMED?'Das Mikrofon ist in diesem Fenster gesperrt. Bitte die App in einem neuen Tab öffnen.':'Bitte erlaube das Mikrofon (Schloss-Symbol neben der Adresse) und halte dann den Knopf gedrückt.';$('tab').style.display=FRAMED?'block':'none'}
function micState(on){$('mic').classList.toggle('on',on);$('mt').textContent=on?'Ich höre zu …':'Halten & sprechen'}
function stopAll(){tok++;clearTimeout(numT);vDisarm();holding=false;clearTimeout(adv);try{rec&&rec.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}micState(false)}
function go(v){stopAll();if(v!=='ex')vMicStop();document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));$(v).classList.add('on');
  const h=v==='home';$('top').className='top'+(h?' clear':'');$('bt').textContent=h?'':v==='ex'?'Runde '+(ST.rounds+1):TITLES[v];
  $('hb').style.display=h?'flex':'none';$('cnt').style.display=v==='ex'?'block':'none';
  if(h)greet();if(v==='stats')renderStats();if(v==='settings')renderSet();$('sc').scrollTop=0}
function greet(){$('greet').innerHTML=(S.name?`Hallo ${S.name}!<br>`:'')+'Aus Zahlen wird Zauberei.<br>Rechne mit und werde immer besser!'}
function say(){stopAll();const my=tok;speak(`${cur.x} plus ${cur.y}`,()=>{if(my===tok)setTimeout(()=>{if(my===tok)autoListen()},300)})}
function replay(){if(!lock&&!holding)say()}
let pressed=false,retries=0,lastErr='',autoUntil=0,autoTries=0,numT=null,noPh=false;
const PH=['zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig'];
function autoListen(){if(vOn){vArm(8000);return}if(!SR||micOK===false||lock||holding)return;autoUntil=Date.now()+8000;autoTries=0;listenNow()}
function settle(my){if(my!==tok)return;tok++;holding=false;try{rec.abort()}catch(_){}micState(false);judge(heardAll.filter(t=>t.trim()))}
function listenNow(){
  try{speechSynthesis.cancel()}catch(_){}
  holding=true;heardAll=[];lastErr='';clearTimeout(numT);const my=++tok;let sp=false;rec=new SR();rec.lang='de-DE';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=5;rec.onspeechstart=()=>{sp=true};
  if(window.SpeechRecognitionPhrase&&!noPh){try{rec.phrases=PH.map(w=>new SpeechRecognitionPhrase(w,5))}catch(_){noPh=true}}
  rec.onaudiostart=()=>{if(my===tok){micState(true);$('heard').textContent='Jetzt sprechen! 🎙️'}};
  rec.onresult=ev=>{if(my!==tok)return;heardAll=[...ev.results].flatMap(r=>[...r].map(a=>a.transcript));const l=ev.results[ev.results.length-1][0].transcript;if(l.trim())$('heard').innerHTML=hear('Ich höre',l);
    clearTimeout(numT);if(heardAll.some(t=>nums(t).length))numT=setTimeout(()=>settle(my),1000)};
  rec.onerror=ev=>{if(my!==tok)return;lastErr=ev.error;if(ev.error==='phrases-not-supported'){noPh=true;listenNow();return}if(['not-allowed','service-not-allowed','audio-capture'].includes(ev.error)){micOK=false;warn()}else if(ev.error==='network')$('heard').textContent='Die Spracherkennung braucht Internet.'};
  rec.onend=()=>{if(my!==tok)return;holding=false;micState(false);clearTimeout(numT);const h=heardAll.filter(t=>t.trim());
    if(h.some(t=>nums(t).length)){judge(h);return}
    if(micOK!==false&&lastErr!=='network'&&((pressed&&retries++<3)||(Date.now()<autoUntil&&autoTries++<6))){listenNow();return}
    if(h.length){$('heard').textContent=`Ich habe „${h[0]}“ gehört, aber keine Zahl. Versuch es nochmal!`;return}
    if(sp&&micOK!==false&&lastErr!=='network'){$('heard').textContent='Ich habe etwas gehört, aber nicht verstanden. Sag es als Satz, zum Beispiel „Das ist 5“.';return}
    if(micOK!==false&&lastErr!=='network')$('heard').textContent='Ich habe nichts gehört. Halte den Knopf gedrückt, bis du fertig bist.'+(lastErr?` (${lastErr})`:'')};
  try{rec.start()}catch(_){holding=false}}
function startHold(e){e.preventDefault();try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
  pressed=true;if(lock||holding)return;retries=0;
  if(vOn){if(vCtx)vCtx.resume();vArm(12000);return}
  if(!SR){$('heard').textContent='Dieser Browser kann nicht zuhören. Bitte Chrome benutzen.';return}
  if(micOK===false){warn();askMic().then(g=>{micOK=g;if(g)$('heard').textContent='Jetzt den Knopf gedrückt halten und sprechen!'});return}
  listenNow()}
function endHold(){pressed=false;if(vOn){const rc=vRec;if(rc)setTimeout(()=>vFinish(rc),600);return}if(!holding)return;const my=tok;setTimeout(()=>{if(my===tok)try{rec.stop()}catch(_){}},700);
  setTimeout(()=>{if(my===tok&&holding){holding=false;try{rec.abort()}catch(_){}micState(false)}},6000)}
/* Wortliste (Vosk) */
const ONES=['ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'],TENS=['zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
const GRAM=JSON.stringify(['null','eins','ein','zwei','zwo','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn',...TENS,'hundert','einhundert','und',...TENS.flatMap(t=>ONES.map(o=>o+'und'+t)),'[unk]']);
const MODEL_URLS=['vosk-model-small-de-0.15.tar.gz','https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-de-0.15.tar.gz'];
let vModel=null,vLoading=null,vOn=false,vCtx=null,vStream=null,vNode=null,vRec=null,vText='',vTimer=null,vNum=null,engNote='';
const vst=t=>{$('vst').textContent=t};
const mb=b=>(b/1048576).toFixed(1).replace('.',',');
function vProg(txt,done,total){vst(txt);if(txt&&$('ex').classList.contains('on'))$('heard').textContent=txt;
  document.querySelectorAll('.vp').forEach(e=>{e.style.display=txt?'block':'none';e.classList.toggle('ind',!total);e.firstChild.style.width=total?Math.round(done/total*100)+'%':''})}
async function vFetch(u,n){
  let c=null;try{c=await caches.open('zz-vosk');const h=await c.match(u);if(h)return await h.blob()}catch(_){}
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),30000);let r;
  try{r=await fetch(u,{signal:ac.signal})}catch(e){throw new Error('keine Antwort vom Server')}finally{clearTimeout(t)}
  if(!r.ok)throw new Error('Datei nicht gefunden (HTTP '+r.status+')');
  const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0,last=Date.now(),stalled=false;
  const watch=setInterval(()=>{if(Date.now()-last>30000){stalled=true;rd.cancel().catch(()=>{})}},3000);
  try{for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;last=Date.now();
    vProg(`Lade Wortliste-Modell (${n}): ${mb(got)}${tot?' von '+mb(tot):''} MB`+(tot?` (${Math.round(got/tot*100)} %)`:''),got,tot)}}finally{clearInterval(watch)}
  if(stalled||(tot&&got<tot))throw new Error('Download stockt oder wurde unterbrochen');
  const b=new Blob(parts);try{c&&await c.put(u,new Response(b))}catch(_){}return b}
function vLoad(){if(vModel)return Promise.resolve(vModel);if(vLoading)return vLoading;
  vLoading=(async()=>{vProg('Lade Spracherkennung …',0,0);
    if(!window.Vosk)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js';s.onload=res;s.onerror=()=>rej(new Error('Bibliothek konnte nicht geladen werden.'));document.head.appendChild(s)});
    const errs=[],names=['eigene Datei','öffentliche Kopie'];
    for(let k=0;k<MODEL_URLS.length;k++){try{
      const b=await vFetch(new URL(MODEL_URLS[k],location.href).href,names[k]);
      vProg('Modell wird entpackt und gestartet … (kann etwas dauern)',0,0);
      vModel=await Promise.race([Vosk.createModel(URL.createObjectURL(b)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Zeitüberschreitung beim Starten')),180000))]);
      vProg('',0,0);vst('Wortliste bereit ✓');return vModel}
    catch(e){errs.push(names[k]+': '+e.message)}}
    throw new Error('Modell nicht verfügbar. '+errs.join(' · ')+'. Lege vosk-model-small-de-0.15.tar.gz neben index.html oder wähle Chrome.')})();
  vLoading.catch(e=>{vLoading=null;vProg('',0,0);vst(e.message)});return vLoading}
function preload(){vLoad().catch(()=>{})}
async function vMic(){if(!vNode){vStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
  vCtx=new(window.AudioContext||window.webkitAudioContext)();const src=vCtx.createMediaStreamSource(vStream);vNode=vCtx.createScriptProcessor(4096,1,1);
  vNode.onaudioprocess=e=>{if(vRec)try{vRec.acceptWaveform(e.inputBuffer)}catch(_){}};src.connect(vNode);vNode.connect(vCtx.destination)}
  await vCtx.resume();vOn=true}
function vMicStop(){vOn=false;vDisarm();try{vNode&&vNode.disconnect()}catch(_){}try{vStream&&vStream.getTracks().forEach(t=>t.stop())}catch(_){}try{vCtx&&vCtx.close()}catch(_){}vNode=vStream=vCtx=null}
function vDisarm(){clearTimeout(vTimer);clearTimeout(vNum);if(vRec){try{vRec.remove()}catch(_){}vRec=null}holding=false;micState(false)}
function vArm(ms){if(!vOn||lock)return;vDisarm();const rc=new vModel.KaldiRecognizer(vCtx.sampleRate,GRAM);vRec=rc;vText='';holding=true;micState(true);$('heard').textContent='Jetzt sprechen! 🎙️';
  rc.on('partialresult',m=>vGot(rc,m.result.partial,false));rc.on('result',m=>vGot(rc,m.result.text,true));vTimer=setTimeout(()=>vEnd(rc),ms)}
function vGot(rc,t,fin){if(rc!==vRec||lock||!t)return;t=t.replace(/\[unk\]/g,'').replace(/\s+/g,' ').trim();if(!t)return;vText=t;$('heard').innerHTML=hear('Ich höre',t);
  clearTimeout(vNum);if(nums(t).length)vNum=setTimeout(()=>vSettle(rc),fin?0:800)}
function vSettle(rc){if(rc!==vRec)return;const t=vText;vDisarm();judge([t])}
function vEnd(rc){if(rc!==vRec)return;const t=vText;vDisarm();$('heard').textContent=t?`Ich habe „${t}“ gehört, aber keine Zahl. Versuch es nochmal!`:'Ich habe nichts gehört. Halte den Knopf gedrückt, bis du fertig bist.'}
function vFinish(rc){if(rc!==vRec)return;nums(vText).length?vSettle(rc):vEnd(rc)}
function start(m){mode=m;i=0;ok=0;streak=0;engNote='';go('ex');askMic().then(async g=>{micOK=g;if(!$('ex').classList.contains('on'))return;
  if(S.engine==='vosk'&&g){$('heard').textContent='Lade Wortliste … (beim ersten Mal ca. 45 MB)';try{await vLoad();await vMic()}catch(e){vOn=false;engNote='Wortliste nicht verfügbar, es wird die Chrome-Erkennung genutzt. '+(e&&e.message||'')}}
  if(!$('ex').classList.contains('on')){vMicStop();return}next()})}
function next(){lock=false;if(i>=S.len)return finish();
  const m=S.addMax,a=R(1,m-1),b=R(1,m-a);cur={x:a,y:b,a:a+b};
  $('cnt').textContent=`⭐ ${i+1}/${S.len}`;$('msg').textContent='';$('tab').style.display='none';
  const ears=mode==='ears';$('rep').style.display=ears?'block':'none';
  $('q').innerHTML=ears?'👂':`${a} <span>+</span> ${b} <span>=</span> ?`;
  $('heard').textContent=SR||vOn?'Sag die Lösung, sobald der Knopf orange leuchtet. Wird nichts erkannt, halte den Knopf gedrückt.':'Dieser Browser kann nicht zuhören. Bitte Chrome benutzen.';if(engNote){$('heard').textContent=engNote;engNote=''}
  if(micOK===false)warn();if(ears)say();else autoListen()}
const esc=t=>t.replace(/[&<>]/g,'');
function hear(label,t){const n=nums(t);return `${label}: „${esc(t)}“`+(n.length&&!/^\s*\d+\s*$/.test(t)?` → <b>${n.join(' / ')}</b>`:'')}
function judge(alts){lock=true;const k=mode,good=alts.some(t=>nums(t).includes(cur.a));
  const best=alts.find(t=>nums(t).includes(cur.a))||alts.find(t=>nums(t).length)||alts[0];$('heard').innerHTML=hear('Ich habe gehört',best);
  $('q').innerHTML=`${cur.x} <span>+</span> ${cur.y} <span>=</span> ${cur.a}`;
  if(good){ok++;streak++;ST.best=Math.max(ST.best,streak);ST[k].r++;beep(660);beep(880,.2);$('msg').textContent=['Super! ✨','Toll gezaubert! 🪄','Richtig! ⭐','Wow! 🎉'][R(0,3)]}
  else{streak=0;ST[k].w++;beep(220,.3);$('msg').textContent='Fast! Das nächste schaffst du! 💪'}
  save();adv=setTimeout(()=>{i++;next()},2300)}
function finish(){
  const p=ok/S.len,st=p>=.9?3:p>=.6?2:1;ST.rounds++;ST.stars+=st;save();
  $('ds').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);$('dp').textContent=`${S.name?S.name+', du':'Du'} hast ${ok} von ${S.len} Aufgaben richtig gelöst.`;
  $('again').onclick=()=>start(mode);go('done');
  for(let c=0;c<24;c++){const e=document.createElement('div');e.className='confetti';e.textContent=['⭐','✨','🎉','🪄'][R(0,3)];e.style.left=R(0,95)+'vw';e.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function renderStats(){$('sS').textContent=ST.stars;$('sR').textContent=ST.rounds;$('sB').textContent=ST.best;
  const row=(n,o)=>{const t=o.r+o.w,p=t?Math.round(o.r/t*100):0;return `<div class="row"><span>${n}</span><span>${o.r} richtig · ${o.w} falsch</span></div><div class="pbar"><i style="width:${p}%"></i></div>`};
  $('sList').innerHTML=row('👀 Sehen',ST.eyes)+row('👂 Hören',ST.ears)}
function resetStats(){if(confirm('Statistik wirklich löschen?')){ST=ZERO();save();renderStats()}}
function chips(el,items,isOn,click){$(el).innerHTML='';items.forEach(([l,v])=>{const b=document.createElement('button');b.className='chip'+(isOn(v)?' on':'');b.textContent=l;b.onclick=()=>{click(v);save();renderSet()};$(el).appendChild(b)})}
function renderSet(){$('sName').value=S.name;
  chips('sAdd',[[10,10],[20,20],[100,100]],v=>S.addMax===v,v=>S.addMax=v);
  chips('sLen',[[5,5],[10,10],[15,15]],v=>S.len===v,v=>S.len=v);
  chips('sEng',[['Chrome','chrome'],['Wortliste','vosk']],v=>S.engine===v,v=>{S.engine=v;if(v==='vosk')preload()});
  chips('sSnd',[['🔊 an',true],['🔇 aus',false]],v=>S.sound===v,v=>S.sound=v)}

$('sName').oninput=e=>{S.name=e.target.value.trim();save()};
greet();
</script>
